<div *ngIf="pageLoader" class="row">
  <app-spinner></app-spinner>
</div>

<div *ngIf="!pageLoader">
  <div class="breadcrumb">
    <h1>Apps</h1>
  </div>
  <div class="top-filter-sec list-button mt-2">
    <div class="row mb-4">
      <div class="col-md-6 col-7">
        <div class="form-group search_bar m-0">
          <input type="text" name="search_bar" placeholder="Search" class="form-control" [(ngModel)]="search_bar" />
          <div class="search_icon"><span class="material-symbols-rounded">search</span></div>
        </div>
      </div>
      <div class="col-md-6 col-5 list-button d-flex justify-content-end">
        <button type="button" routerLink="/admin/features/add">
          <span class="material-symbols-rounded">add</span>Feature
        </button>
      </div>
    </div>
    <div class="row mb-4">
      <div class="col-md-4">
        <div class="form-group">
          <select name="selected_category" (change)="onChange();" [(ngModel)]="selected_category" class="form-control select-arrow">
            <option value="all">All</option>
            <option *ngFor="let x of commonService.feature_categories | numOrderAsc:'rank';" value="{{x.name}}">{{x.name}}</option>
          </select>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <select name="selected_package" (change)="onChange();" [(ngModel)]="selected_package" class="form-control select-arrow">
            <option value="all">All</option>
            <option *ngFor="let x of commonService.admin_packages | numOrderAsc:'rank';" value="{{x._id}}">{{x.name}}</option>
          </select>
        </div>
      </div>
      <div class="col-md-4">
        <div class="form-group">
          <select name="fea_type" (change)="onChange();" [(ngModel)]="fea_type" class="form-control select-arrow">
            <option value="all">All</option>
            <option value="free">Free</option>
            <option value="paid">Paid</option>
          </select>
        </div>
      </div>
    </div>
  </div>  

  <!-- DATA LIST -->
  <div *ngIf="(list | fieldSearch:'name':search_bar)?.length" class="list-horizontal">
    <div class="data-list-card-wrapper">
      <div class="data-list-card-inner">
        <div class="list-item data-list-card" *ngFor="let x of list | fieldSearch:'name':search_bar | numOrderAsc:'rank' | paginate: { itemsPerPage: pageSize, currentPage: page }; let i=index;" [@animate]="{value:'*',params:{delay: (i*100)+'ms', y:'50px'}}">
          <div class="col-md-8 col-8 first_col px-0">
            <p class="w-40 w-sm-100 m-b-0 dark-font">{{ x.name }}</p>
            <p class="w-60 w-sm-100 m-b-0 light-font">
              <ng-container *ngIf="x.packages?.length">
                <!-- <span>{{ x.packages.join(', ')}}</span> -->
              <li *ngFor="let p of x.packages;">{{p}}</li>
            </ng-container>
            <ng-container *ngIf="!x.packages?.length">NA</ng-container></p>
          </div>
          <div class="col-md-4 col-4">
            <div class="row justify-content-end" [ngClass]="commonService.desktop_device? '': 'more_icons'">
              <button [ngClass]="commonService.desktop_device? 'light-button mr-3': 'iconbutton'" (click)="deleteForm = x; modalService.open(deleteModal, { centered: true });">
                <span class="material-symbols-rounded" title="Share">delete</span> {{commonService.desktop_device? 'Remove': ''}}
              </button>
              <button [ngClass]="commonService.desktop_device? 'dark-button': 'iconbutton'" routerLink="/admin/features/update/{{x._id}}">
                <span class="material-symbols-rounded right_arrow transicon" title="Edit">{{commonService.desktop_device? 'visibility': 'chevron_right'}}</span> {{commonService.desktop_device? 'View': ''}}
              </button>
            </div>
          </div>
          
        </div>
        
      </div>
    </div>

    <!-- PAGINATION CONTROL -->
    <div class="row">
      <div class="col-md-12 mt-3">
        <pagination-controls (pageChange)="page=$event; commonService.pageTop(0);" autoHide="true" responsive="true"
          maxSize="5" previousLabel="" nextLabel=""></pagination-controls>
      </div>
    </div>
  </div>


  <div *ngIf="!(list | fieldSearch:'name':search_bar)?.length" class="row">
    <div class="col-md-12 d-flex flex-column align-items-center justify-content-center no-rec-found-wrapper">
      <img class="no-rec-found" src="assets/images/no_records_found.png" alt="no-records">
      <p align="center">No data to display</p>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<ng-template #deleteModal let-modal>
  <div class="modal-body">
    <p><strong>Are you sure you want to remove <span class="text-danger">"{{deleteForm.name}}"</span> app?</strong>
    </p>
    <div *ngIf="deleteForm.errorMsg">
      <p class="text-danger">{{ deleteForm.errorMsg }}</p>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" id="closeModal" class="btn btn-wide btn-outline-secondary"
      (click)="modal.dismiss('Cross click');">No</button>
    <button type="button" (click)="onDelete();" class="btn btn-primary">Yes</button>
  </div>
</ng-template>
