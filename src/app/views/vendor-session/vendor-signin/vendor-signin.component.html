<div [@animate]="{value:'*',params:{y:'120px',opacity:'0',delay:'100ms', duration: '400ms'}}">
  <div class="row">
    <div class="col-md-12">
      <div class="auth-card">
        <div class="text-center mb-3">
          <img [src]="commonService.vendor_login_info?.logo" style="height: 60px;" alt="logo">
        </div>
        <form autocomplete="off" (ngSubmit)="signin()" ngNativeValidate ngbAutofocus>
          <div class="form-group mb-3">
            <div class="custom-input-prepend-group">
              <i class="material-icons-outlined">alternate_email</i>
              <input placeholder="EMAIL" type="email" name="email" class="form-control" [(ngModel)]="loginForm.email" (input)="loginForm.errorMsg=null;" required />
            </div>
          </div>
          <div class="form-group mb-3">
            <div class="custom-input-prepend-append-group">
              <div class="custom-input-prepend">
                <i class="material-icons-outlined">lock</i>
              </div>
              <input placeholder="PASSWORD" [type]="loginForm.input_txt? 'text': 'password'" name="password"
                class="form-control" [(ngModel)]="loginForm.password" (input)="loginForm.errorMsg=null;" required />
                <div class="custom-input-append">
                  @if (!loginForm.input_txt) {
                    <i class="material-icons" (click)="loginForm.input_txt = !loginForm.input_txt" aria-hidden="true">visibility</i>
                  }
                  @if (loginForm.input_txt) {
                    <i class="material-icons" (click)="loginForm.input_txt = !loginForm.input_txt" aria-hidden="true">visibility_off</i>
                  }
                </div>
              </div>
            </div>
            @if (loginForm.errorMsg) {
              <div align="center" style="margin: 20px 0 10px 0;">
                <p style="color:red;"><strong>{{loginForm.errorMsg}}</strong></p>
              </div>
            }
            <!-- <div class="form-group" style="margin: 25px 0 25px 0;">
            <label class="checkbox checkbox-primary">
              <input class="form-check-input" type="checkbox" name="remember_me" [(ngModel)]="loginForm.remember_me" #remember_me="ngModel">
              <span>Keep me logged in</span><span class="checkmark"></span>
            </label>
          </div> -->
          <!-- <br> -->
          <div class="row">
            @if (router.url.indexOf('branch')==-1) {
              <div class="col-sm-12 d-flex align-items-center justify-content-end">
                <div class="forgot-password-link mt-2 mb-3">
                  <a class="text-muted cursor" [style.color]="commonService.vendor_login_info?.theme_color+' !important'"
                  routerLink="/vendor/forgot-password/{{commonService.vendor_login_info?.id}}">Forgot Password</a>
                </div>
              </div>
            }
            <div class="col-md-12">
              <button type="submit" class="btn btn-wide orng-outline-btn ladda-button w-100 m-1" [disabled]="loading" [ladda]="loading"
                [style.background-color]="commonService.vendor_login_info?.theme_color+' !important'">
                <span [style.color]="commonService.vendor_login_info?.theme_text+' !important'"
                class="orng-outline-txt">Sign In</span>
              </button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
