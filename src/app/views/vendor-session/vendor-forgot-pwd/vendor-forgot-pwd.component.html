<div [@animate]="{value:'*',params:{y:'120px',opacity:'0',delay:'100ms', duration: '400ms'}}">
  <div class="row">
    <div class="col-md-12">
      <div class="auth-card">
        <div class="text-center mb-3">
          <img [src]="commonService.vendor_login_info?.logo" style="height: 60px;" alt="logo">
        </div>
        <form autocomplete="off" (ngSubmit)="submit()" ngNativeValidate ngbAutofocus>
          <div class="form-group mb-1">
            <div class="custom-input-prepend-group">
              <i class="material-icons-outlined">alternate_email</i>
              <input placeholder="EMAIL" type="email" name="email" class="form-control" [(ngModel)]="forgotForm.email"
                #email="ngModel" (input)="successMsg=null; errorMsg=null;" required />
              </div>
            </div>
            @if (successMsg || errorMsg) {
              <div align="center" style="margin: 20px 0 10px 0;">
                @if (successMsg) {
                  <div><b class="text-success">{{ successMsg }}</b></div>
                }
                @if (errorMsg) {
                  <div><b class="text-danger">{{ errorMsg }}</b></div>
                }
              </div>
            }
            <div class="row">
              <div class="col-md-12 d-flex align-items-center">
                <div class="forgot-password-link mt-3 mb-3">
                  <a class="text-muted cursor" [style.color]="commonService.vendor_login_info?.theme_color+' !important'"
                  routerLink="/vendor/signin/{{commonService.vendor_login_info?.name}}">Back to Sign In</a>
                </div>
              </div>
              <div class="col-md-12">
                <button type="submit" class="btn btn-wide orng-outline-btn ladda-button w-100 m-1" [disabled]="loading" [ladda]="loading"
                  [style.background-color]="commonService.vendor_login_info?.theme_color+' !important'">
                  <span [style.color]="commonService.vendor_login_info?.theme_text+' !important'"
                  class="orng-outline-txt">Reset Password</span>
                </button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
