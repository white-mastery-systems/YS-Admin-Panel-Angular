<div *ngIf="pageLoader" class="row">
  <app-spinner></app-spinner>
</div>
<div class="inner-dots" *ngIf="!commonService.desktop_device">
  <div class="add_but" routerLink="/setting/collections/add/{{maxRank+1}}">
      <span class="material-symbols-rounded">add</span>
  </div>
</div>
<div *ngIf="!pageLoader">
  <ng-container *ngIf="commonService.desktop_device">
    <div class="breadcrumb">
      <h1>Collections</h1>
    </div>
  </ng-container>

  <div class="top-filter-sec list-button">
    <div class="row mb-4">
      <div class="col-md-6 col-12">
        <div class="form-group search_bar m-0">
          <input type="text" name="search_bar" placeholder="Search" class="form-control" [(ngModel)]="search_bar" />
          <div class="search_icon"><span class="material-symbols-rounded">search</span></div>
        </div>
      </div>
      <div class="col-md-6 list-button d-flex justify-content-end" *ngIf="commonService.desktop_device">
        <button type="button" class="mr-3" (click)="open_website()">
          <span class="material-symbols-rounded">visibility</span>View Page
        </button>
        <button class="highbutton" type="button" routerLink="/setting/collections/add/{{maxRank+1}}">
          <span class="material-symbols-rounded">add</span>Add Collection
        </button>
      </div>
    </div>
  </div>

  <!-- DATA LIST -->
  <div *ngIf="(list | fieldSearch:'name':search_bar)?.length" class="list-horizontal">

    <div class="data-list-card-wrapper">
      <div class="data-list-card-inner">
        <div class="list-item data-list-card" *ngIf="commonService.desktop_device">
          <div class="col-md-8 col-8 first_col px-0 header-font">
            <p class="w-30 w-sm-100">Name</p>
            <p class="w-70 w-sm-100 m-b-0 dark-font">Options</p>
          </div>
        </div>
        <div class="list-item data-list-card" *ngFor="let x of list | numOrderAsc:'rank' | fieldSearch:'name':search_bar | paginate: { itemsPerPage: pageSize, currentPage: page }; let i=index;" [@animate]="{value:'*',params:{delay: (i*100)+'ms', y:'50px'}}">
          <div class="col-md-8 col-8 first_col px-0">
            <p class="w-30 w-sm-100 dark-font">{{x.name}}</p>
            <p class="w-70 w-sm-100 m-b-0 light-font">{{x.option_list?.length}} Options</p>
          </div>
          <div class="col-md-4 col-4">
            <div class="row justify-content-end" [ngClass]="commonService.desktop_device? '': 'more_icons'">             
              <button [ngClass]="commonService.desktop_device? 'light-button  mr-3': 'iconbutton'" (click)="deleteForm = x; modalService.open(deleteModal, { centered: true });">
                <span class="material-symbols-rounded">delete</span> {{commonService.desktop_device? 'Remove':
                ''}}
              </button>  
              <button [ngClass]="commonService.desktop_device? 'light-button': 'iconbutton'" (click)="goModifyPage(x);">
                <span class="material-symbols-rounded right_arrow transicon">{{commonService.desktop_device? 'visibility':
                  'chevron_right'}} </span> {{commonService.desktop_device? 'View': ''}}
              </button>                    
            </div>            
          </div>
        </div>
      </div>      
    </div>

    <!-- PAGINATION CONTROL -->
    <div class="row">
      <div class="col-md-12 mt-3">
        <pagination-controls (pageChange)="page=$event; commonService.pageTop(0);" autoHide="true" responsive="true"
          maxSize="5" previousLabel="" nextLabel=""></pagination-controls>
      </div>
    </div>


  </div>

  <div *ngIf="!(list | fieldSearch:'name':search_bar)?.length" class="row">
    <div class="col-md-12 d-flex flex-column align-items-center justify-content-center no-rec-found-wrapper">
      <img class="no-rec-found" src="assets/images/no_records_found.png" alt="no-records">
      <p align="center">No data to display</p>
    </div>
  </div>
</div>

<!-- DELETE MODAL -->
<ng-template #deleteModal let-modal>
  <div class="modal-body">
    <p><strong>Are you sure you want to delete <span class="txt-grdint-highlight">"{{deleteForm.name}}"</span>
        collection?</strong></p>
    <div *ngIf="deleteForm.errorMsg">
      <p class="text-danger">{{ deleteForm.errorMsg }}</p>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" id="closeModal" class="btn btn-wide black-outline-btn"
      (click)="modal.dismiss('Cross click');">
      <span class="black-outline-txt">No</span>
    </button>
    <button type="button" (click)="onDelete();" class="btn btn-wide orng-outline-btn">
      <span class="orng-outline-txt">Yes</span>
    </button>
  </div>
</ng-template>
