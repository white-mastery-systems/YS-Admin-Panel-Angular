<div *ngIf="pageLoader" class="row">
  <app-spinner></app-spinner>
</div>
<div class="inner-dots" *ngIf="!commonService.desktop_device">
  <div class="help_mobile_button mr-3" routerLink="/support/navigation/header-menu">
    <img src="assets/icons/help.svg" title="help">
  </div>
  <div class="add_but" (click)="openAddMenuModal(addModal);">
      <span class="material-symbols-rounded">add</span>
  </div>
</div>
<div *ngIf="!pageLoader">
  <ng-container *ngIf="commonService.desktop_device">
    <div class="breadcrumb with-back-btn">
      <div class="row">
        <div class="col-md-8">
          <h1>{{title}}</h1>
        </div>
        <div class="col-md-4 d-flex justify-content-end">
          <button class="help-button" routerLink="/support/navigation/header-menu">
            <span class="material-symbols-rounded mb-0">help</span>Need Help?
          </button>
        </div>
      </div>
    </div>
  </ng-container>

  <div class="top-filter-sec list-button">
    <div class="row mb-4">
      <div class="col-md-6 col-12">
        <div class="form-group search_bar m-0">
          <input type="text" name="search_bar" placeholder="Search" class="form-control" [(ngModel)]="search_bar" />
          <div class="search_icon"><span class="material-symbols-rounded">search</span></div>
        </div>
      </div>
      <div class="col-md-6 d-flex justify-content-end" *ngIf="commonService.desktop_device">
        <button class="highbutton" type="button" (click)="openAddMenuModal(addModal);">
          <span class="material-symbols-rounded">add</span>Add New
        </button>
      </div>
      <!-- search box -->
     
    </div>
  </div>

  <!-- DATA LIST -->

  <div *ngIf="(list | fieldSearch:'name':search_bar)?.length" class="row" class="list-horizontal">
    <div class="data-list-card-wrapper">
      <div class="data-list-card-inner">
        <div class="list-item data-list-card" *ngIf="commonService.desktop_device">
          <div class="col-md-5 col-4 first_col px-0 header-font">
            <p class="w-50 w-sm-100 m-b-0">Name</p>
            <p class="w-50 w-sm-100 m-b-0">Sections</p>
          </div>
        </div>
        <div class="list-item data-list-card" *ngFor="let x of list | numOrderAsc:'rank' | fieldSearch:'name':search_bar | paginate: { itemsPerPage: pageSize, currentPage: page }; let i = index" [@animate]="{value:'*',params:{delay: (i*100)+'ms', y:'50px'}}">
          <div class="col-md-5 col-4 first_col px-0 cursor">
            <p class="w-50 w-sm-100 m-b-0  m-b-0 dark-font">{{x.name}}</p>
            <p class="w-50 w-sm-100 m-b-0 light-font">{{x.image_list?.length}} Sections</p>
          </div>
          <div class="col-md-7 col-8 d-flex justify-content-end">
            <button [ngClass]="commonService.desktop_device? 'light-button mr-3': 'iconbutton'" (click)="maxRank=list.length; onEdit(x, editModal);">
              <span class="material-symbols-rounded" title="edit">edit</span>
              {{commonService.desktop_device? 'Edit': ''}}
            </button>
            <button [ngClass]="commonService.desktop_device? 'light-button mr-3': 'iconbutton'" routerLink="/product-sections/catalogs/navigation/{{params.id}}/{{x._id}}">
              <span class="material-symbols-rounded right_arrow transicon" title="view sections">{{commonService.desktop_device? 'visibility': 'chevron_right'}}</span>
              {{commonService.desktop_device? 'View': ''}}
            </button>
            <button [ngClass]="commonService.desktop_device? 'light-button': 'iconbutton'" (click)="deleteForm=x; modalService.open(deleteModal, { centered: true });">
              <span class="material-symbols-rounded right_arrow transicon" title="delete">delete</span>
              {{commonService.desktop_device? 'Remove': ''}}
            </button>     
          </div>
        </div>
      </div>      
    </div>

    

    <!-- PAGINATION CONTROL -->
    <div class="row">
      <div class="col-md-12 mt-3">
        <pagination-controls (pageChange)="page=$event; commonService.pageTop(0);" autoHide="true" responsive="true"
          maxSize="5" previousLabel="" nextLabel=""></pagination-controls>
      </div>
    </div>
   

  </div>

  <div *ngIf="!(list | fieldSearch:'name':search_bar)?.length" class="row">
    <div class="col-md-12 d-flex flex-column align-items-center justify-content-center no-rec-found-wrapper">
      <img class="no-rec-found" src="assets/images/no_records_found.png" alt="no-records">
      <p align="center">No data to display</p>
    </div>
  </div>
</div>

<!-- ADD MODAL -->
<ng-template #addModal let-modal>
  <form autocomplete="off" (ngSubmit)="onAdd()" ngNativeValidate>
    <div class="modal-content">
  <div class="modal-header">
    <h4>
      <span class="material-symbols-rounded cursor" (click)="modal.dismiss('Cross click');">arrow_back</span>
      <span class="popup_text">Add New</span>
     </h4>        
  </div>  
    <div class="modal-body">
      <div class="form-group">
        <div class="row">
          <div class="col-md-12 form-group mb-3">
            <label>Name</label>
            <input type="text" name="name" class="form-control" [(ngModel)]="addForm.name" #name="ngModel" required />
          </div>
          <div class="col-md-12 form-group mb-3">
            <label>Rank</label>
            <input type="number" (wheel)="commonService.handleWheel($event)" name="rank" class="form-control" [(ngModel)]="addForm.rank" #rank="ngModel" min="1"
              max="{{maxRank+1}}" appNumberOnly required />
          </div>
          <div class="col-md-12 form-group mb-3">
            <label class="checkbox checkbox-primary">
              <input class="form-check-input" type="checkbox" name="isMultiImages" [(ngModel)]="addForm.isMultiImages">
              <span>Allow multiple images per section</span>
              <span class="checkmark"></span>
            </label>
          </div>
        </div>
      </div>
      <div *ngIf="addForm.errorMsg">
        <p class="text-danger">{{ addForm.errorMsg }}</p>
      </div>
    </div>
    <div class="modal-footer">
      <button type="button" id="closeModal" class="btn btn-wide black-outline-btn"
        (click)="modal.dismiss('Cross click');">
        <span class="black-outline-txt">Cancel</span>
      </button>
      <button type="submit" class="btn btn-wide btn-primary">Add</button>
    </div>
  </div></form>
</ng-template>

<!-- EDIT MODAL -->
<ng-template #editModal let-modal>
  <form autocomplete="off" (ngSubmit)="onUpdate()" ngNativeValidate ngbAutofocus>
    <div class="modal-content">
      <div class="modal-header">
        <h4>
          <span class="material-symbols-rounded cursor" (click)="modal.dismiss('Cross click');">arrow_back</span>
          <span class="popup_text">{{ editForm.name }}</span>
         </h4>        
      </div>
      <div *ngIf="popupLoader" class="modal-body">
        <app-popup-spinner></app-popup-spinner>
      </div>
      <div *ngIf="!popupLoader" class="modal-body">
        <div class="form-group">
          <div class="row">
            <div class="col-md-12 form-group mb-3">
              <label>Name</label>
              <input type="text" name="name" class="form-control" [(ngModel)]="editForm.name" #name="ngModel" required />
            </div>
            <div class="col-md-12 form-group mb-3">
              <label>Rank</label>
              <input type="number" (wheel)="commonService.handleWheel($event)" name="rank" class="form-control" [(ngModel)]="editForm.rank" #rank="ngModel" min="1"
                max="{{maxRank}}" appNumberOnly required />
            </div>
          </div>
        </div>
        <div *ngIf="editForm.errorMsg">
          <p class="text-danger">{{ editForm.errorMsg }}</p>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="closeModal" class="btn btn-wide black-outline-btn"
          (click)="modal.dismiss('Cross click');">
          <span class="black-outline-txt">Cancel</span>
        </button>
        <button type="submit" class="btn btn-wide btn-primary">Update</button>
      </div>
    </div>
  </form>
</ng-template>

<!-- DELETE MODAL -->
<ng-template #deleteModal let-modal>
  <div class="modal-body">
    <p><strong>Are you sure you want to remove <span class="txt-grdint-highlight">"{{deleteForm.name}}"</span>?</strong></p>
    <div *ngIf="deleteForm.errorMsg">
      <p class="text-danger">{{ deleteForm.errorMsg }}</p>
    </div>
  </div>
  <div class="modal-footer">
    <button type="button" id="closeModal" class="btn btn-wide black-outline-btn"
      (click)="modal.dismiss('Cross click');">
      <span class="black-outline-txt">No</span>
    </button>
    <button type="button" (click)="onDelete();" class="btn btn-wide orng-outline-btn">
      <span class="orng-outline-txt">Yes</span>
    </button>
  </div>
</ng-template>
