  <!-- list -->
  <ng-container *ngFor="let x of list;">
    <div class="row d-flex px-2">
      <div class="col-md-12 setting_head">
        <h6>{{x.name}}</h6>
      </div>
    </div>
    <!-- menus -->
    <div *ngIf="x.menu_list?.length" class="row d-flex px-0 margin-minus10">
      <div class="col-4 col-md-4 px-2 row_margin" *ngFor="let y of x.menu_list">
        <div class="card d-flex align-items-center justify-content-start py-3 px-2"  [routerLink]="y.link">
          <div class="icons">
            <span class="material-symbols-rounded">{{y.icon}}</span>
          </div>
           <label class="text-title cursor">{{y.name}}</label>
         </div>
    </div>
      <!-- <div class="col-6 col-md-6 px-2 mb-3" *ngFor="let y of x.menu_list">
