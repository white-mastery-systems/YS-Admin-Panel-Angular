<div [hidden]="commonService.secondary_header || router.url=='/product-sections'" class="row" style="margin-left:-25px; margin-top:-20px;">
  <div class="carosal">
    <ul class="px-3">
      @for (x of commonService.product_menu_list; track x; let i = $index) {
        <li (click)="onSelect(i+1);" id="elem_{{i+1}}">
          <a class="hz_carosal" [routerLink]="x.state" [routerLinkActive]="'carosal_button'">{{ x.name }}</a>
        </li>
      }
    </ul>
  </div>
</div>

<router-outlet (activate)="commonService.onActivate($event)"></router-outlet>
