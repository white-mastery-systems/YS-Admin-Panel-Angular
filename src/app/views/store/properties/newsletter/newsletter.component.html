<div *ngIf="pageLoader" class="row">
  <app-spinner></app-spinner>
</div>
<div class="inner-dots" *ngIf="!commonService.desktop_device">
  <div class="add_but mr-3" (click)="onOpenFilterModal(filterModal);">
    <span class="material-symbols-rounded">filter_alt</span>
  </div>
  <div class="add_but" (click)="exportAsXLSX();">
    <span class="material-symbols-rounded">file_upload</span>
  </div>
</div>

<div *ngIf="!pageLoader">
  <ng-container *ngIf="commonService.desktop_device">
    <div class="breadcrumb">
      <h1>Newsletter Subscribers</h1>
    </div>
  </ng-container>

  <div class="top-filter-sec list-button">
    <div class="row mb-4">
      <div class="col-md-6 col-12">
        <div class="form-group search_bar m-0">
          <input type="text" name="search_bar" placeholder="Search" class="form-control" [(ngModel)]="search_bar" />
          <div class="search_icon"><span class="material-symbols-rounded">search</span></div>
        </div>
      </div>
      <div class="col-md-6 list-button d-flex justify-content-end" *ngIf="commonService.desktop_device">
        <button type="button" class="mr-3" (click)="onOpenFilterModal(filterModal);">
          <span class="material-symbols-rounded">filter_alt</span>Filter
        </button>
        <button type="button" (click)="exportAsXLSX();" [disabled]="exportLoader"><span
            class="material-symbols-rounded">file_upload</span>Export</button>
      </div>
    </div>
  </div>
  <div *ngIf="(list | fieldSearch:'email':search_bar)?.length" class="list-horizontal">
    <div class="data-list-card-wrapper">
      <div class="data-list-card-inner">
        <div class="list-item data-list-card" *ngIf="commonService.desktop_device">
          <div class="col-md-12 col-12 first_col px-0 header-font">
            <p class="w-30 w-sm-100">Email</p>
            <p class="w-30 w-sm-100 m-b-0">Date & Time</p>
          </div>
        </div>
        <div class="list-item data-list-card" *ngFor="let x of list | fieldSearch:'email':search_bar | numOrderDesc:'created_on' | paginate: { itemsPerPage: pageSize, currentPage: page }; let i=index;" [@animate]="{value:'*',params:{delay: (i*100)+'ms', y:'50px'}}">
          <div class="col-md-12 col-12 first_col px-0">
            <p class="w-30 w-sm-100 dark-font">{{x.email}}</p>
            <p class="w-30 w-sm-100 light-font">{{x.created_on | date: "dd MMM y hh:mm a"}}</p>
          </div>
        </div>
      </div>
    </div>

    <!-- PAGINATION CONTROL -->
    <div class="row">
      <div class="col-md-12 mt-3">
        <pagination-controls (pageChange)="page=$event; commonService.pageTop(0);" autoHide="true" responsive="true"
          maxSize="5" previousLabel="" nextLabel=""></pagination-controls>
      </div>
    </div>


  </div>

  <div *ngIf="!(list | fieldSearch:'email':search_bar)?.length" class="row">
    <div class="col-md-12 d-flex flex-column align-items-center justify-content-center no-rec-found-wrapper">
      <img class="no-rec-found" src="assets/images/no_records_found.png" alt="no-records">
      <p align="center">No data to display</p>
    </div>
  </div>
</div>

<!-- filter Modal -->
<ng-template #filterModal let-modal>
  <form autocomplete="off" ngbAutofocus>
    <div class="modal-content">
      <div class="modal-header">
        <h4>
          <span class="material-symbols-rounded cursor" (click)="filterForm=tempFilter; modal.dismiss('Cross click');">arrow_back</span>
          <span class="popup_text">Filter</span>
        </h4>
      </div>
      <div class="modal-body filtersec">
        <div class="row m-0">
          <div class="carosal w-100">
            <ul class="px-3">
              <li>
                <a class="hz_carosal carosal_button">By Date</a>
              </li>
            </ul>
          </div>
        </div>
        <div class="row m-0 p-3">
          <div class="col-md-12 d-flex pb-3">
            <!-- from date -->
            <div class="col-md-6 col-6">
              <div class="form-group">
                <input type="text" placeholder="Select Date" class="form-control" name="form_date" [(ngModel)]="filterForm.from"
                bsDatepicker [bsConfig]="{ showWeekNumbers: false, dateInputFormat: 'DD-MM-YYYY' }" readonly />
              </div>
            </div>
            <!-- to date -->
            <div class="col-md-6 col-6">
              <div class="form-group">
                <input type="text" placeholder="Select Date" class="form-control" name="to_date" [(ngModel)]="filterForm.to"
                bsDatepicker [minDate]="filterForm.from" [bsConfig]="{ showWeekNumbers: false, dateInputFormat: 'DD-MM-YYYY' }" readonly />
              </div>
            </div>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" id="closeModal" class="d-none" (click)="modal.dismiss('cancel');"></button>
        <button type="button" class="btn btn-wide black-outline-btn" (click)="filterForm=tempFilter; modal.dismiss('cancel');">
          <span class="black-outline-txt">Cancel</span>
        </button>
        <button type="button" class="btn btn-wide orng-outline-btn m-1" (click)="ngOnInit();">
          <span class="orng-outline-txt">Apply</span>
        </button>
      </div>
    </div>
  </form>
</ng-template>
