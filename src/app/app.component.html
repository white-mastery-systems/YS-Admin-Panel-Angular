<button id="mybtn" (click)="testNotify()" style="display: none;">Test Button</button>
<router-outlet (activate)="commonService.onActivate($event)"></router-outlet>

<audio controls id="audio-file" style="display: none;">
  <source src="assets/audio/notification.mp3" type="audio/mpeg">
</audio>

@if (commonService.toastMsg) {
  <div class="toastbar">
    <div id="toaster-div">
      @if (commonService.toastMsg) {
        <div id="snackbar" [ngClass]="commonService.toastErr? 'red':'green'">
          <div class="px-0" >
            {{commonService.toastMsg}}
          </div>
        </div>
      }
    </div>
  </div>
}
